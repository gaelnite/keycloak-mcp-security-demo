name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python and Cedar dependencies
        run: |
          pip install -r mcp/requirements.txt
          cd mcp && npm ci --no-audit --no-fund
      - name: Run unit tests (includes real Cedar evaluations)
        run: python -m unittest discover -s tests -t . -v

  cedar-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Cedar WASM
        working-directory: mcp
        run: npm ci --no-audit --no-fund
      - name: Validate the policy bundle
        run: echo '{"op":"validate"}' | node mcp/pdp.mjs
      - name: Check the generated bundle matches the tool registry
        run: python3 mcp/gen_cedar.py --check

  ci-gate:
    if: ${{ always() }}
    needs: [unit-tests, cedar-policy]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require all CI jobs to pass
        env:
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          CEDAR_RESULT: ${{ needs.cedar-policy.result }}
        run: |
          for result in "$UNIT_RESULT" "$CEDAR_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "::error::A required CI job did not succeed. Review the prerequisite jobs."
              exit 1
            fi
          done
