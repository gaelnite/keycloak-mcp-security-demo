# Lint configuration only. There is deliberately no [project] or [build-system]
# table: this repository is not an installable package, and adding one would make
# the repo root shadow `pip install -r mcp/requirements.txt`.
[tool.ruff]
target-version = "py311"
line-length = 120
src = ["mcp", "tests"]
extend-exclude = ["mcp/node_modules", "mcp/generated_tool_wrappers.py"]

[tool.ruff.lint]
# Narrow set: correctness, bugbear, datetime and audit-logging rules that the
# codebase already satisfies. Widened in a follow-up commit of the same branch.
select = ["E4", "E7", "E9", "W", "B", "DTZ", "G", "PIE", "RET", "ISC"]

[tool.ruff.lint.per-file-ignores]
# Tests bootstrap sys.path before importing the flat runtime modules.
"tests/*" = ["E402"]

[tool.ruff.lint.isort]
# The runtime modules are flat modules under mcp/, not a package.
known-first-party = [
  "approval",
  "auth",
  "delegation",
  "desktop_oauth",
  "gen_cedar",
  "gen_tool_wrappers",
  "generated_tool_wrappers",
  "keycloak_admin",
  "pep",
  "server",
  "server_config",
  "tool_handlers",
  "tool_registry",
]
