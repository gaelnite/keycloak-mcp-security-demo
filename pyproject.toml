# Lint configuration only. There is deliberately no [project] or [build-system]
# table: this repository is not an installable package, and adding one would make
# the repo root shadow `pip install -r mcp/requirements.txt`.
[tool.ruff]
target-version = "py311"
line-length = 120
src = ["mcp", "tests"]
extend-exclude = ["mcp/node_modules", "mcp/generated_tool_wrappers.py"]

[tool.ruff.lint]
# Correctness, style and security rules curated for a security reference demo:
# pyflakes, isort, bugbear, pyupgrade, comprehensions, simplification, datetime,
# logging-format and bandit-derived checks.
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "C4", "DTZ", "G", "PIE", "S"]
# E501: long policy strings and Cedar expressions are clearer unwrapped.
# S105: the OAuth token-type URNs are protocol constants, not passwords.
ignore = ["E501", "S105"]

[tool.ruff.lint.per-file-ignores]
# Tests bootstrap sys.path before importing the flat runtime modules, and assert
# is the natural unittest vocabulary.
"tests/*" = ["E402", "S101"]

[tool.ruff.lint.isort]
# The runtime modules are flat modules under mcp/, not a package.
known-first-party = [
  "approval",
  "auth",
  "delegation",
  "desktop_oauth",
  "gen_cedar",
  "gen_tool_wrappers",
  "generated_tool_wrappers",
  "keycloak_admin",
  "pep",
  "server",
  "server_config",
  "tool_handlers",
  "tool_registry",
]
