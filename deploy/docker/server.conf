server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    trust_domain = "mcp.demo"
    data_dir = "/data"
    socket_path = "/run/spire-control/api.sock"
    federation {
        bundle_endpoint {
            address = "0.0.0.0"
            port = 8443
            refresh_hint = "30s"
            profile "https_web" {
                serving_cert_file {
                    cert_file_path = "/conf/bundle.crt"
                    key_file_path = "/conf/bundle.key"
                    file_sync_interval = "1m"
                }
            }
        }
    }
}
plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/data/store.sqlite3"
        }
    }
    KeyManager "disk" { plugin_data { keys_path = "/data/keys.json" } }
    NodeAttestor "x509pop" { plugin_data { ca_bundle_path = "/conf/node-ca.crt" } }
    UpstreamAuthority "disk" {
        plugin_data {
            cert_file_path = "/conf/server-ca.crt"
            key_file_path = "/conf/server-ca.key"
        }
    }
}
