worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 256; }

http {
    access_log off;
    client_max_body_size 4m;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=5s ipv6=off;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Connection "";
    proxy_set_header Host localhost:@PORT@;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host localhost:@PORT@;
    proxy_set_header X-Forwarded-Port @PORT@;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix "";

    server {
        listen @PORT@ ssl;
        server_name localhost;
        server_tokens off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /tls/edge.crt;
        ssl_certificate_key /tls/edge.key;
        if ($http_host != "localhost:@PORT@") { return 421; }

        location = /healthz { proxy_pass http://127.0.0.1:8800/healthz; }
        location = /mcp { proxy_pass http://127.0.0.1:8800/mcp; }
        location = /.well-known/oauth-protected-resource/mcp {
            proxy_pass http://127.0.0.1:8800/.well-known/oauth-protected-resource/mcp;
        }

        set $issuer keycloak:8080;
        location = /.well-known/oauth-authorization-server/realms/lab {
            proxy_pass http://$issuer$uri$is_args$args;
        }
        location ~ ^/realms/lab/(?:\.well-known/openid-configuration|protocol/openid-connect/(?:auth|token|certs|logout|userinfo)|login-actions/[a-z-]+)$ {
            proxy_pass http://$issuer$uri$is_args$args;
        }
        location ^~ /resources/ {
            proxy_pass http://$issuer$uri$is_args$args;
        }
        location / { return 404; }
    }

@PRIVATE_ADMIN@
}
