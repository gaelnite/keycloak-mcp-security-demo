    server {
        listen 127.0.0.1:8801 ssl;
        server_name localhost;
        server_tokens off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /tls/edge.crt;
        ssl_certificate_key /tls/edge.key;
        client_max_body_size 2k;
        if ($http_host != "localhost:8801") { return 421; }

        set $issuer keycloak:8080;
        location ^~ /admin/realms/lab/ {
            # Nginx auth_request runs a GET subrequest whose URI is the checker.
            # Snapshot the original method and normalized URI in the main request.
            set $admin_method $request_method;
            set $admin_path $uri;
            set $admin_query $args;
            auth_request /_admin_auth;
            proxy_pass http://$issuer$admin_path$is_args$args;
        }
        location = /_admin_auth {
            internal;
            proxy_pass http://127.0.0.1:8800/__delegated_admin_check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Admin-Method $admin_method;
            proxy_set_header X-Admin-Path $admin_path;
            proxy_set_header X-Admin-Query $admin_query;
            proxy_set_header Authorization $http_authorization;
        }
        location / { return 404; }
    }
