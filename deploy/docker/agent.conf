agent {
    data_dir = "/data"
    server_address = "spire-server"
    server_port = "8081"
    socket_path = "/run/workload/api.sock"
    trust_bundle_path = "/conf/server-ca.crt"
    trust_domain = "mcp.demo"
}
plugins {
    NodeAttestor "x509pop" {
        plugin_data {
            private_key_path = "/conf/node.key"
            certificate_path = "/conf/node.crt"
        }
    }
    KeyManager "disk" { plugin_data { directory = "/data" } }
    WorkloadAttestor "unix" { plugin_data { discover_workload_path = true } }
}
